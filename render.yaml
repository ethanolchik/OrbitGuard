services:
  - type: web
    name: orbitguard-api-ethanolchik
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/orbitguard.db
      - key: FRONTEND_URL
        value: https://orbitguard.ethanolchik.me
      - key: TLE_SOURCE_URL
        value: https://raw.githubusercontent.com/ethanolchik/OrbitGuard/main/backend/data/stations.tle
